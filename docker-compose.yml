services:
  rename-images:
    build: .
    image: data-source:v1
    container_name: rename_images
    # Đổi tên ảnh thành số CCCD ngẫu nhiên
    command: python rename_images_cccd.py
    volumes:
      - ./images:/app/images
      - ./rename_images_cccd.py:/app/rename_images_cccd.py
    networks:
      - platform_net

  put-images-oracle:
    build: .
    image: data-source:v1
    container_name: put_images_oracle
    # Đẩy ảnh (đã đổi tên thành CCCD) lên Oracle
    command: python putimg_orcl.py
    volumes:
      - ./images:/app/images
      - ./putimg_orcl.py:/app/putimg_orcl.py
    environment:
      # Kết nối Oracle qua tên container trong network "platform_net"
      ORACLE_HOST: oracle-db
      ORACLE_USER: IMGDATA
      ORACLE_PASSWORD: Nam12345
      ORACLE_SERVICE: XEPDB1
    networks:
      - platform_net

# Dùng chung network với stack "platform" (infra/docker-compose.yml)
# → container có thể gọi "oracle-db" bằng tên thay vì IP
networks:
  platform_net:
    external: true
    name: platform_default
